  apiVersion: v1
  kind: Service
  metadata:
    name: fastapi-service-clusterip
  spec:
    type: ClusterIP
    selector:
      app: fastapi-backend
    ports:
      - protocol: TCP
        port: 80
        targetPort: 8000
---
  apiVersion: v1
  kind: Service
  metadata:
    name: sqlite-web-service-clusterip
  spec:
    type: ClusterIP
    selector:
      app: sqlite-viewer
    ports:
      - protocol: TCP
        port: 80
        targetPort: 8080
---
  apiVersion: v1
  kind: Service
  metadata:
    name: fastapi-service-loadbalancer
  spec:
    type: LoadBalancer
    selector:
      app: fastapi-backend
    ports:
      - protocol: TCP
        port: 8000
        targetPort: 8000
---
  apiVersion: v1
  kind: Service
  metadata:
    name: sqlite-web-service-loadbalancer
  spec:
    type: LoadBalancer
    selector:
      app: sqlite-viewer
    ports:
      - protocol: TCP
        port: 8080
        targetPort: 8080
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: fastapi-service-clusterip
                port:
                  number: 80
          - path: /db
            pathType: ImplementationSpecific
            backend:
              service:
                name: sqlite-web-service-clusterip
                port:
                  number: 80